<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugadores - Más Que Amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/jugadores.css">
    <link rel="stylesheet" href="css/modales.css">

    <script src="js/config.js"></script>
    <script defer src="js/app.js"></script>
    <script defer type="module" src="js/jugadores.js"></script>
</head>
<body data-page="jugadores">
    <!-- Contenedor del menú -->
    <div id="menu-container"></div>

    <!-- Contenido de jugadores -->
    <div class="main-content">
        <header class="banner banner--jugadores">
            <h2>JUGADORES</h2>
            <p class="banner-subtitle">La plantilla completa de cada equipo</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <div class="botones">
            <button class="btn" id="btn-agregar-jugador" data-requiere-admin="true">Agregar jugador</button>
            <button class="btn" id="btn-agregar-lote" data-requiere-admin="true">Cargar varios jugadores</button>
        </div>

        <!-- Visible solo para un DT sin equipo asignado (ver js/app.js). -->
        <p class="aviso-sesion" data-aviso-dt-sin-equipo hidden>
            Aún no tienes un equipo asignado, por eso no puedes solicitar traspasos.
            Pídele a la organización que te asigne uno.
        </p>

        <div class="jugadores-toolbar">
            <input id="buscar-jugador" type="search" placeholder="Buscar jugador por nombre" aria-label="Buscar jugador por nombre">
            <select id="filtro-equipo" aria-label="Filtrar por equipo">
                <option value="">Todos los equipos</option>
            </select>
            <fieldset id="filtro-posicion" class="filtro-checkboxes">
                <legend>Posición</legend>
                <label><input type="checkbox" value="PORTERO"> Portero</label>
                <label><input type="checkbox" value="DEFENSA"> Defensa</label>
                <label><input type="checkbox" value="MEDIOCAMPISTA"> Mediocampista</label>
                <label><input type="checkbox" value="DELANTERO"> Delantero</label>
            </fieldset>
        </div>

        <section class="jugadores-container">
            <div class="loading-state">Cargando jugadores...</div>
        </section>
    </div>
    <div id="modal-container"></div>
    <div id="modal-lote-container"></div>
    <div id="modal-traspaso-container"></div>
    <div id="modal-historial-container"></div>
    <!-- Contenedor del footer -->
    <div id="footer-container"></div>
</body>
</html>
