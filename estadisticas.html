<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Más Que Amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/estadisticas.css">
    <link rel="stylesheet" href="css/modales.css">

    <script src="js/config.js"></script>
    <script defer src="js/app.js"></script>
    <!-- Chart.js (FRONTEND_VISION.md Fase4 bonus: "permitete darle estilo
         con diferentes graficos ademas de la informacion"), cargado antes
         que estadisticas.js para que exista como global cuando este corra. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
    <script defer type="module" src="js/estadisticas.js"></script>
</head>
<body data-page="estadisticas">
    <!-- Contenedor del menú -->
    <div id="menu-container"></div>

    <!-- Contenido de estadísticas -->
    <div class="main-content">
        <header class="banner banner--estadisticas">
            <h2>ESTADÍSTICAS</h2>
            <p class="banner-subtitle">Goles, tarjetas y asistencias de cada jugador</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <div class="botones">
            <button class="btn" id="btn-agregar-estadistica">Registrar estadística</button>
        </div>

        <!-- FRONTEND_VISION.md Fase4: "Deberia permitir consultar
             estadisticas de jugadores, partidos y equipos [...] titulos
             ganados, participaciones entre ellas". La tabla de abajo ya
             cubre jugador+partido; este resumen agrega por equipo. -->
        <section class="estadisticas-resumen">
            <h3>Resumen por equipo</h3>
            <div class="estadisticas-resumen-grid">
                <div class="tabla-scroll">
                    <table class="estadisticas-table" id="tabla-resumen-equipos">
                        <thead>
                            <tr>
                                <th>Equipo</th>
                                <th>Partidos jugados</th>
                                <th>Títulos</th>
                                <th>Goles</th>
                                <th>T. Amarillas</th>
                                <th>T. Rojas</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-resumen-equipos-body">
                            <tr><td colspan="6" class="loading-state">Cargando resumen...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="chart-card">
                    <canvas id="chart-equipos-stats"></canvas>
                </div>
            </div>
        </section>

        <div class="estadisticas-toolbar">
            <select id="filtro-jugador" aria-label="Filtrar por jugador">
                <option value="">Todos los jugadores</option>
            </select>
            <select id="filtro-partido" aria-label="Filtrar por partido">
                <option value="">Todos los partidos</option>
            </select>
        </div>

        <section class="estadisticas-container">
            <div class="loading-state">Cargando estadísticas...</div>
        </section>
    </div>
    <div id="modal-container"></div>
    <!-- Contenedor del footer -->
    <div id="footer-container"></div>
</body>
</html>
