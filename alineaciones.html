<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alineaciones - Más Que Amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/alineaciones.css">
    <link rel="stylesheet" href="css/modales.css">

    <script src="js/config.js"></script>
    <script defer src="js/app.js"></script>
    <script defer type="module" src="js/alineaciones.js"></script>
</head>
<body data-page="alineaciones">
    <!-- Contenedor del menú -->
    <div id="menu-container"></div>

    <!-- Contenido de alineaciones -->
    <div class="main-content">
        <header class="banner banner--alineaciones">
            <h2>ALINEACIONES</h2>
            <p class="banner-subtitle">Titulares y suplentes de cada partido</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <div class="botones">
            <button class="btn" id="btn-agregar-alineacion">Alinear jugador</button>
        </div>

        <div class="alineaciones-toolbar">
            <select id="filtro-partido-alineacion" aria-label="Seleccionar partido">
                <option value="">Seleccione un partido para ver su alineación</option>
            </select>
        </div>

        <section class="alineacion-resultado">
            <!-- Titulares/suplentes del partido elegido se generan dinámicamente -->
        </section>

        <!-- fase3-09/fase3-10: registrar un cambio de jugador (solo visible
             si el partido esta EN_CURSO) y ver el historial (cambios +
             estadisticas con minuto) del partido seleccionado. -->
        <section class="cambio-jugador-wrapper" id="cambio-jugador-wrapper" hidden>
            <h3>Registrar cambio</h3>
            <form id="form-cambio-jugador" class="cambio-jugador-form" novalidate>
                <label for="cambio-equipo">Equipo:</label>
                <select id="cambio-equipo" required>
                    <option value="">Seleccione un equipo</option>
                </select>

                <label for="cambio-sale">Jugador que sale (titular):</label>
                <select id="cambio-sale" required disabled>
                    <option value="">Seleccione un equipo primero</option>
                </select>

                <label for="cambio-entra">Jugador que entra (suplente):</label>
                <select id="cambio-entra" required disabled>
                    <option value="">Seleccione un equipo primero</option>
                </select>

                <label for="cambio-minuto">Minuto:</label>
                <input type="number" id="cambio-minuto" min="0" step="1" required>

                <div id="cambio-form-status" class="form-status" aria-live="polite"></div>

                <button type="submit" class="btn">Registrar cambio</button>
            </form>
        </section>

        <section class="historial-partido" id="historial-partido" hidden>
            <h3>Historial del partido</h3>
            <ul class="historial-lista" id="historial-lista">
                <!-- cambios + estadisticas con minuto, generado dinamicamente -->
            </ul>
        </section>
    </div>
    <div id="modal-container"></div>
    <!-- Contenedor del footer -->
    <div id="footer-container"></div>
</body>
</html>
