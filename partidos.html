<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos - Más Que Amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/partidos.css">
    <link rel="stylesheet" href="css/modales.css">

    <script src="js/config.js"></script>
    <script defer src="js/app.js"></script>
    <script defer type="module" src="js/partidos.js"></script>
</head>
<body data-page="partidos">
    <!-- Contenedor del menú -->
    <div id="menu-container"></div>

    <!-- Contenido de partidos -->
    <div class="main-content">
        <header class="banner banner--partidos">
            <h2>PARTIDOS</h2>
            <p class="banner-subtitle">Calendario y resultados del torneo</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <div class="botones">
            <button class="btn" id="btn-agregar-partido">Programar partido</button>
            <button class="btn" id="btn-sorteo-partidos">Sortear partidos</button>
        </div>

        <div class="partidos-toolbar">
            <input id="buscar-partido" type="search" placeholder="Buscar partidos por equipo" aria-label="Buscar partidos por equipo">
            <select id="filtro-fase" aria-label="Filtrar por fase">
                <option value="">Todas las fases</option>
                <option value="FASE_DE_GRUPOS">Fase de grupos</option>
                <option value="REPECHAJE">Repechaje</option>
                <option value="ELIMINACION_DIRECTA">Eliminación directa</option>
                <option value="FINAL">Final</option>
            </select>
            <label class="rango-fecha-label">Desde
                <input id="filtro-fecha-desde" type="date" aria-label="Fecha desde">
            </label>
            <label class="rango-fecha-label">Hasta
                <input id="filtro-fecha-hasta" type="date" aria-label="Fecha hasta">
            </label>
            <button type="button" id="btn-orden-fecha" class="btn btn-small" aria-label="Cambiar orden por fecha">Fecha ↑</button>
        </div>

        <section class="partidos-container">
            <div class="loading-state">Cargando partidos...</div>
        </section>
    </div>
    <div id="modal-container"></div>
    <div id="modal-sorteo-container"></div>
    <!-- Contenedor del footer -->
    <div id="footer-container"></div>
</body>
</html>
