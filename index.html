<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COPA DE FÚTBOL Más Que Amigos</title>    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="js/config.js"></script>
    <script defer src="js/app.js"></script>
    <!-- Chart.js (bonus "Gráficos" de FRONTEND_API_PROMPT.md), cargado antes
         del módulo que lo usa; expone el global window.Chart. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
    <script defer type="module" src="js/dashboard.js"></script>
</head>
<body data-page="index">
   
 <!-- Aquí se cargará dinámicamente el menú -->
 <div id="menu-container"></div>

    <!-- Contenedor principal -->
    <div class="main-content">
        
        <!-- Banner superior -->
        <header class="banner banner--hero">
            <h2>⚽ COPA DE FÚTBOL MÁS QUE AMIGOS 🏆</h2>
            <p class="banner-subtitle">Pasión y amistad en cada partido</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <!-- Resumen del torneo -->
        <section class="dashboard-stats">
            <article class="stat-card">
                <i class="fas fa-shield-halved"></i>
                <span class="stat-value" id="stat-equipos">-</span>
                <span class="stat-label">Equipos</span>
            </article>
            <article class="stat-card">
                <i class="fas fa-person-running"></i>
                <span class="stat-value" id="stat-jugadores">-</span>
                <span class="stat-label">Jugadores</span>
            </article>
            <article class="stat-card">
                <i class="fas fa-futbol"></i>
                <span class="stat-value" id="stat-partidos">-</span>
                <span class="stat-label">Partidos</span>
            </article>
            <article class="stat-card">
                <i class="fas fa-chart-simple"></i>
                <span class="stat-value" id="stat-estadisticas">-</span>
                <span class="stat-label">Estadísticas registradas</span>
            </article>
        </section>

        <h3 class="section-title">En números</h3>

        <section class="dashboard-charts">
            <article class="chart-card">
                <h4>Jugadores por posición</h4>
                <canvas id="chart-posiciones"></canvas>
            </article>
            <article class="chart-card">
                <h4>Goles por equipo</h4>
                <canvas id="chart-goles-equipo"></canvas>
            </article>
        </section>

        <!-- FRONTEND_VISION.md Fase5, hallazgo 2: la pagina de Inicio debe
             mostrar los registros informativos creados desde Configuracion
             (Fase 6). Se listan los mas recientes primero (el backend ya
             los devuelve en ese orden). -->
        <h3 class="section-title">Novedades del torneo</h3>

        <section class="novedades-container">
            <div class="loading-state">Cargando novedades...</div>
        </section>

        <h3 class="section-title">Galería del torneo</h3>

        <!-- Imagen principal -->
        <section class="main-image">
            <img src="assets/comark.jpg" alt="Imagen del torneo">
            <img src="assets/mackalister.jpg" alt="Imagen del torneo2">
            <img src="assets/losdel8.jpg" alt="Imagen del torneo3">
            <img src="assets/mrl.jpg" alt="Imagen del torneo5">
            <img src="assets/socios.jpg" alt="Imagen del torneo4">
           
        </section>
    </div>
     <!-- Aquí se cargará dinámicamente el footer -->
     <div id="footer-container"></div>
</body>
</html>
