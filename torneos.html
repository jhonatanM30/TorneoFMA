<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos - Más Que Amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/partidos.css">
    <link rel="stylesheet" href="css/torneos.css">
    <link rel="stylesheet" href="css/modales.css">

    <script src="js/config.js"></script>
    <script defer src="js/app.js"></script>
    <script defer type="module" src="js/torneos.js"></script>
</head>
<body data-page="torneos">
    <!-- Contenedor del menú -->
    <div id="menu-container"></div>

    <div class="main-content">
        <header class="banner banner--partidos">
            <h2>TORNEOS</h2>
            <p class="banner-subtitle">Ligas, grupos y eliminatorias del torneo</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <!-- Lista de torneos (consulta pública) -->
        <section id="vista-lista">
            <div class="botones">
                <button class="btn" id="btn-crear-torneo" data-requiere-admin="true">Crear torneo</button>
            </div>

            <section id="torneos-lista" class="torneos-lista">
                <div class="loading-state">Cargando torneos...</div>
            </section>
        </section>

        <!-- Detalle de un torneo -->
        <section id="vista-detalle" class="torneo-detalle" hidden></section>
    </div>

    <div id="modal-torneo-container"></div>
    <div id="modal-container"></div>
    <!-- Contenedor del footer -->
    <div id="footer-container"></div>
</body>
</html>
