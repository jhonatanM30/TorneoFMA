<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos - Más Que Amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/equipos.css">
    <link rel="stylesheet" href="css/modales.css">
    
    <script src="js/config.js"></script>
    <script defer src="js/app.js"></script>
    <script defer type="module" src="js/equipos.js"></script>
</head>
<body data-page="equipos">
    <!-- Contenedor del menú -->
    <div id="menu-container"></div>

    <!-- Contenido de equipos -->
    <div class="main-content">
        <header class="banner banner--equipos">
            <h2>EQUIPOS PARTICIPANTES</h2>
            <p class="banner-subtitle">Pasión y amistad en cada partido</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <div class="botones">
            <button class="btn">Sorteo de partidos</button>
            <button class="btn">Ver Equipos en Repechaje</button>
            <button class="btn">Agregar un nuevo equipo</button>
        </div>

        <div class="equipos-toolbar">
            <input id="buscar-equipo" type="search" placeholder="Buscar equipo por nombre" aria-label="Buscar equipo por nombre">
        </div>

        <section class="equipos-container">
            <div class="loading-state">Cargando equipos...</div>
        </section>
    </div>
    <div id="modal-container"></div>
    <!-- Contenedor del footer -->
    <div id="footer-container"></div>
</body>
</html>
