<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos - Más Que Amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/equipos.css">
    <link rel="stylesheet" href="css/modal-crear-equipo.css">
    
    <script defer src="js/app.js"></script>
    <script defer type="module" src="js/equipos.js"></script>
</head>
<body>
    <!-- Contenedor del menú -->
    <div id="menu-container"></div>

    <!-- Contenido de equipos -->
    <div class="main-content">
        <header class="banner">
            <h2>EQUIPOS PARTICIPANTES</h2>
            <p class="banner-subtitle">Pasión y amistad en cada partido</p>
            <p class="banner-date">Edición 2025 - Inicia el 26 de Diciembre</p>
        </header>

        <div class="botones">
            <button class="btn">Sorteo de partidos</button>
            <button class="btn">Ver Equipos en Repechaje</button>
            <button class="btn">Agregar un nuevo equipo</button>
        </div>       

        <section class="equipos-container">
            <!-- Las tarjetas de equipos se generarán dinámicamente -->
        </section>
    </div>
    <div id="modal-container"></div>
    <!-- Contenedor del footer -->
    <div id="footer-container"></div>
</body>
</html>
